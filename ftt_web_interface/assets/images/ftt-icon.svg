<!-- assets/images/ftt-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#009879"/>

  <!-- Subtle grid / map background -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <path d="M16 10v44"/>
    <path d="M32 10v44"/>
    <path d="M48 10v44"/>
    <path d="M10 16h44"/>
    <path d="M10 32h44"/>
    <path d="M10 48h44"/>
  </g>

  <!-- Map pin (slightly smaller, upper half only) -->
  <g transform="translate(32,20) scale(0.9) translate(-32,-20)">
    <path d="M32 14
             a9 9 0 0 0 -9 9
             c0 6.8 9 16.5 9 16.5
             s9-9.7 9-16.5
             a9 9 0 0 0 -9-9z"
          fill="#ffffff"/>
    <circle cx="32" cy="23" r="4.5" fill="#009879"/>
  </g>

  <!-- “FTT” text in the lower half, larger -->
  <text x="32" y="50"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14"
        fill="#ffffff"
        font-weight="700">
    FTT
  </text>
</svg>